name: PR Red-Gate and Conflict Triage

on:
  workflow_dispatch:
  schedule:
    # Four daily UTC runs; local German wall-clock time shifts with DST.
    - cron: "0 5,11,17,23 * * *"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  triage:
    name: Inventory and queue PR remediation findings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.ATC_FLEET_READ_TOKEN || github.token }}
      ATC_REMEDIATION_TOKEN: ${{ secrets.ATC_REMEDIATION_TOKEN || github.token }}
      ATC_ORG: A-TownChain-Okosystems
      ATC_CONTROL_REPO: A-TownChain-Okosystems/atc-engineering
      ATC_TRIAGE_DIR: triage-results
    steps:
      - name: Checkout engineering control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate remediation worker and fail-closed tests
        run: |
          python3 -m py_compile .github/scripts/triage-pr-gates.py .github/scripts/remediation-issue-queue.py .github/scripts/tests/test_remediation_issue_queue.py
          python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
      - name: Run read-only triage
        run: python3 .github/scripts/triage-pr-gates.py
      - name: Queue SHA-bound remediation issues
        if: always() && hashFiles('triage-results/findings.json') != ''
        run: python3 .github/scripts/remediation-issue-queue.py
      - name: Publish machine-readable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-red-gate-triage
          path: triage-results/
          if-no-files-found: warn
          retention-days: 30
