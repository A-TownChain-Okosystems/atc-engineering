name: engineering-ci

on:
  push:
    branches: [main, 'ci/**']
  # Validate stacked/feature-branch PRs as well as PRs targeting main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-self-test:
    name: Engineering self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build evidence negative regression tests
        run: python3 tests/test_validate_build_evidence.py
      - name: Test workspace
        run: cargo test --locked --workspace --all-features
      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema>=4.20,<5'
      - name: Validate Rust serialization against JSON Schemas
        run: python3 tests/test_rust_serialization_json_schema.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Record build identity
        id: build_identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_SHA"
          test -n "$EVENT_REF"
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$EVENT_REF" == refs/heads/* ]]
            test -z "$PR_HEAD_SHA"
            normalized_pr_head="N/A (push event: no PR-head context)"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            normalized_pr_head="$PR_HEAD_SHA"
          else
            test -z "$PR_HEAD_SHA"
            normalized_pr_head="N/A ($EVENT_NAME event: no PR-head context)"
          fi
          mkdir -p artifacts
          printf '%s\n' "$EXPECTED_SHA" > artifacts/source-sha.txt
          printf '%s\n' "$checked_out_sha" > artifacts/checked-out-sha.txt
          printf '%s\n' "$EVENT_NAME" > artifacts/event-name.txt
          printf '%s\n' "$EVENT_REF" > artifacts/event-ref.txt
          printf '%s\n' "$normalized_pr_head" > artifacts/pr-head-sha.txt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Release build
        run: cargo build --locked --release

      - name: Audit gate report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p atc-audit-cli -- . --gate | tee artifacts/gate-report.txt
          mapfile -t reports < <(grep '^GATE_REPORT ' artifacts/gate-report.txt | sed 's/^GATE_REPORT //')
          test "${#reports[@]}" -eq 1
          printf '%s\n' "${reports[0]}" > artifacts/gate-report.json

      - name: Validate gate evidence and bind it to this run
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          test -s artifacts/gate-report.txt
          test -s artifacts/gate-report.json
          checked_out_sha="$(git rev-parse HEAD)"
          python3 scripts/validate_build_evidence.py \
            --report artifacts/gate-report.json \
            --binary target/release/atc-audit-cli \
            --expected-sha "$EXPECTED_SHA" \
            --checked-out-sha "$checked_out_sha" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --repository "$REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --event-name "$EVENT_NAME" \
            --event-ref "$EVENT_REF" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --output artifacts/evidence-manifest.json

          test -s artifacts/evidence-manifest.json
          cp target/release/atc-audit-cli artifacts/atc-audit-cli
          # Hash only files included in the uploaded artifact; paths are relative
          # to artifacts/ because upload-artifact strips the parent directory.
          (
            cd artifacts
            sha256sum atc-audit-cli gate-report.json evidence-manifest.json \
              source-sha.txt checked-out-sha.txt event-name.txt event-ref.txt pr-head-sha.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          test -s artifacts/SHA256SUMS

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-engineering-gate-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
